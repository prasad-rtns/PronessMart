# Project identification
sonar.projectKey=pronessmart-order-service
sonar.projectName=PronessMart Order Service
sonar.projectVersion=1.0.0

# Source code location
sonar.sources=src
sonar.tests=tests

# Exclusions
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/*.test.js,**/*.spec.js,**/build/**

# Test coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Code analysis
sonar.sourceEncoding=UTF-8
sonar.language=js

# Additional paths for specific services
sonar.sources=src,helpers,middlewares
