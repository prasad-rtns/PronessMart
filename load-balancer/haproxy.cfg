global
    log stdout format raw local0
    maxconn 4096
    user haproxy
    group haproxy
    daemon

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms
    option  forwardfor
    option  http-server-close

# Frontend for HTTP (Port 80)
frontend http_front
    bind *:80
    
    # ACLs for different paths
    acl is_health path_beg /health
    acl is_api path_beg /api/v1
    acl is_api_v2 path_beg /api/v2
    
    # Route health checks directly
    use_backend health_backend if is_health
    
    # Route API requests to API Gateway pool
    use_backend api_gateway_backend if is_api OR is_api_v2
    
    # Default to API Gateway
    default_backend api_gateway_backend

# Frontend for HTTPS (Port 443)
frontend https_front
    bind *:443
    mode tcp
    option tcplog
    default_backend api_gateway_backend_ssl

# Backend pool of API Gateway instances (HTTP)
backend api_gateway_backend
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    
    # Health check settings
    default-server inter 3s fall 3 rise 2
    
    # Dynamic server discovery - matches scaled api-gateway containers
    # HAProxy will resolve api-gateway service and distribute to all instances
    server-template nginx 1-10 api-gateway:80 check resolvers docker resolve-prefer ipv4

# Backend pool of API Gateway instances (HTTPS)
backend api_gateway_backend_ssl
    mode tcp
    balance roundrobin
    
    # Health check on HTTP port (since health endpoint is HTTP)
    option httpchk GET /health
    http-check expect status 200
    
    # Health check settings
    default-server inter 3s fall 3 rise 2
    
    # Dynamic server discovery for HTTPS
    server-template nginx-ssl 1-10 api-gateway:443 check port 80 resolvers docker resolve-prefer ipv4

# Health check backend - returns OK directly
backend health_backend
    mode http
    errorfile 503 /dev/null
    http-request return status 200 content-type text/plain string "HAProxy Healthy\n"

# DNS Resolvers for Docker service discovery
resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold other 30s
    hold refused 30s
    hold nx 30s
    hold timeout 30s
    hold valid 10s
    hold obsolete 30s

# Stats page for monitoring
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats show-legends
    stats show-node
    stats admin if TRUE
